# Isolated realtime pipelines served by the ComfyStream live-runner.
#
# Each entry runs in its own spawned process (one single-worker
# ProcessPoolExecutor per pipeline), pinned to `gpu` (CUDA_VISIBLE_DEVICES,
# index or GPU UUID), optionally under a different interpreter (`python`) so
# pipelines with conflicting dependencies can share one container.
#
#   policy: warm   load at boot when capacity allows (else start cold), register once ready
#   policy: cold   register at boot, load inside the first /stream request;
#                  with idle_unload_s > 0 the process exits after idling and is
#                  respawned cold, which releases its GPU memory
#
# Callers never send workflows: a session is started with a prompt and/or a
# `preset` from below plus the backend's flat params (GET /status lists them).
#
#   capacity                 concurrent sessions on one loaded model (default 1), up
#                            to what the backend isolates (spec.SESSION_LIMITS);
#                            eviction skips a pipeline while any session is active
#   model                    advertised model id (discovery metadata)
#   cold_start_s             startup estimate until a load has been measured
#   session_idle_timeout_s   expire a session after this long without input (default 15)
#   fallback_after_s         show the fallback visual once inference stalls this long
#   presets                  name -> params (validated against the backend schema)
#   fallbacks                name -> image path or #rrggbb; "default" overrides the
#                            built-in slate shown while paused or failing
#
# capacity decides which pipelines hold GPU memory. Every pipeline registers;
# warm pipelines that fit load at boot (in pipelines-map order) and the rest
# start cold. A stream for a cold pipeline evicts loaded pipelines that are
# not streaming until it fits, waits for their processes to exit, then loads.
# Evicted pipelines re-register cold. If the blockers are streaming, the
# stream is refused with capacity_unavailable. exclusive pipelines load alone.
# combinations, when set, require the loaded set to fit inside one group.

capacity:
  max_loaded: 1
  gpus:
    # 3090 Ti: flux-klein (~16 GB) and sd-turbo (~4.5 GB) swap instead of sharing.
    GPU-745244ef-3615-57bd-458f-299fe2289f5a: 1
    # RTX 4000 Ada is reserved for go-livepeer transcoding (orch + live-runner-transcode).
  exclusive: []

pipelines:
  flux-klein:
    app: comfystream/flux-klein
    backend: comfy_workflow
    port: 8720
    gpu: GPU-745244ef-3615-57bd-458f-299fe2289f5a  # RTX 3090 Ti, ~16.5 GB
    # The resident pipeline: loads at boot and holds the 3090 Ti's single slot.
    policy: warm
    # Raise once the FluxKleinStream node keeps prompt and feedback per session.
    capacity: 1
    model: black-forest-labs/FLUX.2-klein-4B
    cold_start_s: 20
    session_idle_timeout_s: 15
    price: 0.35
    currency: usd
    unit: 720p
    presets:
      neon-stage:
        prompt: a neon-lit concert stage, laser beams, glowing haze, vivid magenta and cyan
        input_blend: 0.4
      watercolor:
        prompt: a soft watercolor painting, flowing pastel colors, paper texture
        input_blend: 0.6
      cosmic:
        prompt: a cosmic nebula, swirling galaxies, shimmering stars, deep space colors
        input_blend: 0.3
    env:
      HF_HUB_CACHE: /workspace/flux-klein/models/hf
      HF_HUB_OFFLINE: "1"
    options:
      workflow: workflows/comfystream/flux-klein-api.json
      prompt_nodes: ["2"]
      params: [prompt, seed, input_blend]
      width: 384
      height: 384

  sd-turbo:
    app: comfystream/sd-turbo
    backend: comfy_workflow
    port: 8721
    gpu: GPU-745244ef-3615-57bd-458f-299fe2289f5a  # RTX 3090 Ti, ~4.5 GB (swaps with flux-klein)
    # Loads on its first stream by evicting an idle flux-klein, and stays loaded
    # until a flux-klein stream evicts it back.
    policy: cold
    # The StreamDiffusion TensorRT workflow runs one stream at a time.
    capacity: 1
    model: stabilityai/sd-turbo
    # ~30 s with cached TensorRT engines; a new GPU arch builds them once (~6 min).
    cold_start_s: 30
    session_idle_timeout_s: 15
    price: 0.35
    currency: usd
    unit: 720p
    presets:
      neon-stage:
        prompt: a neon-lit concert stage, laser beams, glowing haze, vivid magenta and cyan
        negative_prompt: blurry, low quality, distorted
      watercolor:
        prompt: a soft watercolor painting, flowing pastel colors, paper texture
        negative_prompt: blurry, low quality, photo
      anime:
        prompt: masterpiece, high quality, detailed anime character
        negative_prompt: blurry, low quality, distorted, 3d render
    env:
      HF_HUB_CACHE: /workspace/ComfyUI/models
      HF_HUB_OFFLINE: "1"
    options:
      workflow: workflows/comfystream/sd-turbo-streamdiffusion-trt-api.json
      engine_root: /workspace/ComfyUI/models/ComfyStream--engines
      prompt_nodes: ["59"]
      width: 512
      height: 512
